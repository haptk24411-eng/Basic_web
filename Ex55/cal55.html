<html>
    <head>
         <meta charset='utf-8'>
         <title>Tiêu đề trang</title>
         <script>
            function findSolution(){
                var a=eval(myForm.a.value);
                var b=eval(myForm.b.value);
                var c=eval(myForm.c.value);
                var delta=b*b-4*a*c;
                if (delta<0){
                    myForm.result.value="No solution";
                }else if (delta==0){
                    myForm.result.value="x="+(-b/(2*a));
                }else{
                    myForm.result.value="x1="+((-b+Math.sqrt(delta))/(2*a))+"; x2="+((-b-Math.sqrt(delta))/(2*a));
                }
            }
            function clear(){
                myForm.a.value="";
                myForm.b.value="";
                myForm.c.value="";
                myForm.result.value="";
            }
         </script>
    </head>
    <body>
        <form id="myForm">
            <table border="1">
                <colgroup>
                    <col style="width: 20%;">
                    <col style="width: 80%;">
                </colgroup>
                <tr style="background-color: #cfffc3; text-align: center;">
                    <td colspan="2"> The quadratic equation </td>
                </tr>
                <tr>
                    <td style="text-align: center;"> a: </td>
                    <td>
                        <input type="text" id="a" name="a">
                    </td>
                </tr>
                <tr>
                    <td style="text-align: center;"> b: </td>
                    <td>
                        <input type="text" id="b" name="b">
                    </td>
                </tr>
                <tr>
                    <td style="text-align: center;"> c: </td>
                    <td>
                        <input type="text" id="c" name="c">
                    </td>
                </tr>
                <tr>
                    <td style="text-align: center;"> Result:</td>
                    <td>
                        <input type="text" id="result" name="result" width="100%" readonly>
                    </td>
                </tr>
                <tr>
                    <td colspan="2"> 
                        <button type="button" onclick="findSolution()">Find solution </button>
                        <button type="reset" onclick="clear()">Clear </button>
                    </td>
                </tr>
            </table>
       </form>

    </body>
    </html>
