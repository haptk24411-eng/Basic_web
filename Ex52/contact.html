<html>
    <head>
         <meta charset='utf-8'>
         <title>Ex 52</title>
    </head>
    <body>
        <form method="GET" action="response.html">
            <h3> Contact the editorial office </h3>
            <table style="width: 100%">
                <tr>
                    <td>Full name</td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="text" name="full_name" style="width: 100%;"> 
                    </td>
                </tr>
                <tr>
                    <td> Email</td>
                    <td> Send to</td>
                </tr>
                <tr>
                    <td>
                    <input type="email" name="email" style="width: 100%;" ></td>
                    </td>
                    <td>
                        <select name="send_to" size="1" style="width: 100%; font-size: 13px;">
                            <option value="editoral_board">Editoral board</option>
                            <option value="news_department">News Department</option>
                            <option value="board_of_perspectives">Board of Perspectives</option>
                            <option value="world_board">World Board</option>
                            <option value="business_department">Business Department</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td> Title </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="text" name="title" style="width: 100%;" >
                    </td>
                </tr>
                <tr>
                    <td> Content </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <textarea name="content" rows="10" style="width: 100%;"></textarea>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="submit" name="send" value="Send" style="background-color: #9f004f; color: #ffffff; font-size: 15px; width: 100px;">
                    </td>
                </tr>
            </table>
            
        </form>

    </body>
    </html>
